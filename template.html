<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>מדריך אורח</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --fg:#131820; --muted:#5d6774; --line:#e2e6ec;
  --acc:#0e6d51; --accfg:#fff; --wa:#25d366; --tint:#eaf4f0;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1318; --card:#181d24; --fg:#e9edf2; --muted:#98a2ae; --line:#28303a;
         --acc:#3fb392; --accfg:#06120e; --tint:#13241f; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}

header{background:var(--acc);color:var(--accfg);padding:18px 12px 20px}
.hin{max-width:560px;margin:0 auto;display:flex;align-items:flex-start;gap:10px}
.htext{flex:1;min-width:0}
h1{margin:0;font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere}
.area{margin:4px 0 0;font-size:.82rem;opacity:.85;overflow-wrap:anywhere}
#lang{
  flex:none;background:rgba(255,255,255,.18);color:var(--accfg);
  border:1px solid rgba(255,255,255,.55);border-radius:999px;
  padding:7px 13px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap;
}
#lang:active{transform:scale(.97)}

.demo{background:#fde9c8;color:#5c4310;font-size:.8rem;padding:7px 12px;text-align:center}
@media (prefers-color-scheme: dark){ .demo{background:#3a2f14;color:#f0d79b} }

section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;overflow:hidden}
summary{
  cursor:pointer;list-style:none;padding:14px 16px;font-weight:650;font-size:1rem;
  display:flex;align-items:center;gap:10px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";margin-inline-start:auto;color:var(--muted);font-size:1.2rem;line-height:1;transition:transform .15s}
details[open] summary::after{transform:rotate(180deg)}
.ico{font-size:1.2rem;line-height:1}
.body{padding:0 16px 16px}
.body p{margin:0 0 8px}
.body p:last-child{margin-bottom:0}
.muted{color:var(--muted);font-size:.88rem}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kv:last-of-type{border-bottom:0}
.kv b{font-weight:650}
.kv span{color:var(--muted)}

#pass{
  width:100%;background:var(--tint);border:1px dashed var(--acc);color:var(--fg);
  border-radius:12px;padding:13px 14px;font:inherit;font-weight:700;font-size:1.15rem;
  letter-spacing:.04em;cursor:pointer;text-align:center;margin-top:6px;
}
#pass:active{transform:scale(.99)}
#passhint{margin-top:6px;text-align:center}

ul{margin:0;padding-inline-start:20px}
li{margin:6px 0}

a.btn,button.btn{
  display:block;width:100%;text-align:center;text-decoration:none;
  background:var(--acc);color:var(--accfg);border:0;border-radius:12px;
  padding:14px;font:inherit;font-weight:700;margin-top:10px;cursor:pointer;
}
a.wa{background:var(--wa);color:#06210f}
a.line{
  text-decoration:none;color:var(--fg);
  padding:12px 0;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;align-items:center;
}
a.line:last-child{border-bottom:0}
a.line b{font-weight:650}
a.line span{color:var(--acc);font-weight:700;direction:ltr}

.tip{padding:10px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip b{display:block;font-weight:650}
.tip span{color:var(--muted);font-size:.9rem}

footer{text-align:center;color:var(--muted);font-size:.78rem;padding:22px 12px 0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>

<header><div class="hin">
  <div class="htext"><h1 id="pname"></h1><p class="area" id="parea"></p></div>
  <button id="lang" type="button"></button>
</div></header>
<div class="demo" id="demobar" hidden></div>

<main class="wrap" id="main"></main>
<footer id="foot"></footer>

<script>
/* נתוני הנכס מוזרקים כאן על ידי build.py מתוך properties/<id>.json */
const P = __PROPERTY_DATA__;

const UI = {
  he:{ toggle:"English", demo:"זהו נכס לדוגמה. כל הפרטים מומצאים.",
       wifi:"Wi‑Fi", net:"רשת", pass:"סיסמה", tapCopy:"לוחצים על הסיסמה כדי להעתיק אותה",
       copied:"הסיסמה הועתקה ✓", copyFail:"ההעתקה לא עבדה, אפשר להקליד ידנית",
       times:"כניסה ויציאה", cin:"כניסה מ־", cout:"יציאה עד",
       parking:"חניה", nav:"פתיחת ניווט",
       contact:"יצירת קשר", contactLead:"משהו לא ברור? כתבו לנו ונענה מהר.", waBtn:"שליחת הודעה בוואטסאפ",
       rules:"כללי הבית", devices:"הפעלת מכשירים",
       emergency:"מספרי חירום", emergencyNote:"לשאלות על הדירה עדיף לכתוב בוואטסאפ.",
       tips:"מה יש בסביבה", review:"ביקורת",
       reviewLead:"נהניתם? ביקורת קצרה עוזרת לנו מאוד.", reviewBtn:"השארת ביקורת",
       foot:"מדריך אורח" },
  en:{ toggle:"עברית", demo:"This is a demo apartment. All details are made up.",
       wifi:"Wi‑Fi", net:"Network", pass:"Password", tapCopy:"Tap the password to copy it",
       copied:"Password copied ✓", copyFail:"Copy did not work, you can type it",
       times:"Check-in & check-out", cin:"Check-in from", cout:"Check-out until",
       parking:"Parking", nav:"Open navigation",
       contact:"Contact us", contactLead:"Something unclear? Message us and we will reply fast.", waBtn:"Message on WhatsApp",
       rules:"House rules", devices:"How things work",
       emergency:"Emergency numbers", emergencyNote:"For questions about the apartment, WhatsApp is faster.",
       tips:"Around here", review:"Review",
       reviewLead:"Enjoyed your stay? A short review helps us a lot.", reviewBtn:"Leave a review",
       foot:"Guest guide" }
};

const LANG_KEY = "kh-lang";

function initialLang(){
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === "he" || saved === "en") return saved;
  } catch (e) { /* דפדפן שחוסם אחסון — ממשיכים לזיהוי אוטומטי */ }
  return (navigator.language || "he").toLowerCase().indexOf("he") === 0 ? "he" : "en";
}
let lang = initialLang();

const t = k => UI[lang][k];

/* אם השדה חסר בשפה הנבחרת — נופלים לעברית, לא למחרוזת ריקה */
function v(o){
  if (!o) return "";
  const val = o[lang];
  if (val !== undefined && val !== null && String(val).trim() !== "") return val;
  return o.he || o.en || "";
}
const has = x => x !== undefined && x !== null && !(Array.isArray(x) && x.length === 0);

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // טקסט בלבד, אף פעם לא HTML
  return n;
}
function safeUrl(u){ return /^(https?:|tel:)/i.test(u) ? u : "#"; }

function section(icon, title, open){
  const d = el("details"); if (open) d.open = true;
  const s = el("summary");
  s.appendChild(el("span","ico",icon));
  s.appendChild(el("span",null,title));
  const b = el("div","body");
  d.appendChild(s); d.appendChild(b);
  return {wrap:d, body:b};
}
function kv(label, val){
  const r = el("div","kv");
  r.appendChild(el("span",null,label));
  r.appendChild(el("b",null,val));
  return r;
}
function link(cls, href, text){
  const a = el("a",cls,text);
  a.href = safeUrl(href);
  if (/^https?:/i.test(href)){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
  return a;
}

function copyPass(hint){
  const text = P.wifi.pass;
  const ok  = () => { hint.textContent = t("copied"); };
  const bad = () => { hint.textContent = t("copyFail"); };
  const legacy = () => {
    const ta = el("textarea"); ta.value = text;
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    ta.remove();
    done ? ok() : bad();
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok, legacy);
  } else {
    legacy();
  }
}

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang === "he" ? "rtl" : "ltr";
  document.title = v(P.name);

  document.getElementById("pname").textContent = v(P.name);
  document.getElementById("parea").textContent = has(P.area) ? v(P.area) : "";
  document.getElementById("lang").textContent  = t("toggle");

  const bar = document.getElementById("demobar");
  bar.textContent = t("demo");
  bar.hidden = !P.demo;

  const m = document.getElementById("main");
  m.textContent = "";
  let s;

  /* Wi‑Fi — שדה חובה, תמיד מוצג */
  s = section("📶", t("wifi"), true);
  s.body.appendChild(kv(t("net"), P.wifi.ssid));
  const pass = el("button","","" + P.wifi.pass);
  pass.id = "pass"; pass.type = "button";
  const hint = el("p","muted",t("tapCopy")); hint.id = "passhint";
  pass.addEventListener("click", () => copyPass(hint));
  s.body.appendChild(pass); s.body.appendChild(hint);
  m.appendChild(s.wrap);

  /* כניסה ויציאה — שדה חובה */
  s = section("🕒", t("times"), true);
  s.body.appendChild(kv(t("cin"), P.checkin.from));
  s.body.appendChild(kv(t("cout"), P.checkin.to));
  if (has(P.checkin.entry)) s.body.appendChild(el("p",null,v(P.checkin.entry)));
  m.appendChild(s.wrap);

  /* חניה — רשות */
  if (has(P.parking)){
    s = section("🅿️", t("parking"));
    if (has(P.parking.text)) s.body.appendChild(el("p",null,v(P.parking.text)));
    if (has(P.parking.alt))  s.body.appendChild(el("p","muted",v(P.parking.alt)));
    if (has(P.parking.nav))  s.body.appendChild(link("btn", P.parking.nav, t("nav")));
    m.appendChild(s.wrap);
  }

  /* יצירת קשר — שדה חובה */
  s = section("💬", t("contact"), true);
  s.body.appendChild(el("p",null,t("contactLead")));
  if (has(P.host.label)) s.body.appendChild(el("p","muted",v(P.host.label)));
  s.body.appendChild(link("btn wa", "https://wa.me/" + P.host.whatsapp, t("waBtn")));
  m.appendChild(s.wrap);

  /* כללי הבית — רשות */
  if (has(P.rules)){
    s = section("📋", t("rules"));
    const ul = el("ul");
    P.rules.forEach(r => ul.appendChild(el("li",null,v(r))));
    s.body.appendChild(ul);
    m.appendChild(s.wrap);
  }

  /* מכשירים — רשות */
  if (has(P.devices)){
    s = section("🔌", t("devices"));
    P.devices.forEach(d => {
      s.body.appendChild(el("p",null,v(d.name)));
      s.body.appendChild(el("p","muted",v(d.how)));
    });
    m.appendChild(s.wrap);
  }

  /* חירום — רשות */
  if (has(P.emergency)){
    s = section("🚨", t("emergency"));
    P.emergency.forEach(e => {
      const a = link("line", "tel:" + e.tel, "");
      a.appendChild(el("b",null,v(e.name)));
      a.appendChild(el("span",null,e.tel));
      s.body.appendChild(a);
    });
    s.body.appendChild(el("p","muted",t("emergencyNote")));
    m.appendChild(s.wrap);
  }

  /* המלצות — רשות */
  if (has(P.tips)){
    s = section("📍", t("tips"));
    P.tips.forEach(x => {
      const d = el("div","tip");
      d.appendChild(el("b",null,v(x.name)));
      if (has(x.note)) d.appendChild(el("span",null,v(x.note)));
      s.body.appendChild(d);
    });
    m.appendChild(s.wrap);
  }

  /* ביקורת — רשות */
  if (has(P.review) && has(P.review.url)){
    s = section("⭐", t("review"), true);
    s.body.appendChild(el("p",null,t("reviewLead")));
    s.body.appendChild(link("btn", P.review.url, t("reviewBtn")));
    m.appendChild(s.wrap);
  }

  document.getElementById("foot").textContent = t("foot");
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "he" ? "en" : "he";
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* אחסון חסום — הבחירה פשוט לא תישמר */ }
  render();
});
render();
</script>
</body>
</html>
